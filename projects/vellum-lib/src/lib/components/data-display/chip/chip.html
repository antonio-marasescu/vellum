<span
  [attr.id]="id()"
  [class]="chipClasses()"
  [attr.role]="clickable() ? 'button' : null"
  [attr.tabindex]="clickable() && !disabled() ? 0 : null"
  [attr.aria-disabled]="clickable() && disabled() ? true : null"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <span class="vlm-chip__content">
    <ng-content></ng-content>
  </span>
  @if (removable()) {
    <button
      type="button"
      class="vlm-chip__remove inline-flex h-[var(--vlm-chip-remove-size)] w-[var(--vlm-chip-remove-size)] items-center justify-center rounded-full border-0 bg-transparent p-0 text-[color:inherit] outline-none hover:bg-[color:var(--vlm-chip-remove-hover-bg)] focus-visible:bg-[color:var(--vlm-chip-remove-hover-bg)] disabled:cursor-not-allowed"
      [disabled]="disabled()"
      aria-label="Remove"
      (click)="onRemove($event)"
    >
      <svg
        class="h-[var(--vlm-chip-remove-icon-size)] w-[var(--vlm-chip-remove-icon-size)]"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M3 3L13 13M13 3L3 13" />
      </svg>
    </button>
  }
</span>
