<label
  [class]="labelClasses()"
  class="vlm-radio__wrapper inline-flex items-center gap-[var(--vlm-radio-gap)]"
>
  <span class="relative inline-flex">
    <input
      class="peer absolute h-full w-full cursor-pointer opacity-0"
      type="radio"
      [id]="id()"
      [name]="group.name()"
      [value]="value()"
      [checked]="checked()"
      [disabled]="isDisabled()"
      (change)="onChange()"
      (blur)="onBlur()"
    />
    <span [class]="circleClasses()" aria-hidden="true">
      @if (checked()) {
        <span [class]="dotClasses()"></span>
      }
    </span>
  </span>
  @if (label()) {
    <span>{{ label() }}</span>
  }
</label>
