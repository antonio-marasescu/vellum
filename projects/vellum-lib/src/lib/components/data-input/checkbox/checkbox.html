<div class="vlm-checkbox flex flex-col gap-[var(--vlm-checkbox-gap)]">
  <label
    [class]="labelClasses()"
    class="vlm-checkbox__wrapper inline-flex items-center gap-[var(--vlm-checkbox-gap)]"
  >
    <span class="relative inline-flex">
      <input
        class="peer absolute h-full w-full cursor-pointer opacity-0"
        type="checkbox"
        [id]="id()"
        [checked]="checked()"
        [disabled]="disabled()"
        [attr.aria-required]="required() || null"
        [attr.aria-invalid]="invalid() || null"
        [attr.aria-describedby]="showError() ? errorId() : null"
        (change)="onChange($event)"
        (blur)="onBlur()"
      />
      <span [class]="boxClasses()" aria-hidden="true">
        @if (checked()) {
          <svg
            class="h-[70%] w-[70%]"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 8L6.5 11.5L13 4.5" />
          </svg>
        }
      </span>
    </span>
    @if (label()) {
      <span>
        {{ label() }}
        @if (required()) {
          <span class="text-[color:var(--vlm-checkbox-required-color)]" aria-hidden="true">*</span>
        }
      </span>
    }
  </label>
  @if (showError()) {
    <span
      [id]="errorId()"
      class="vlm-checkbox__error text-[length:var(--vlm-checkbox-error-font-size)] text-[color:var(--vlm-checkbox-error-text-color)]"
    >
      {{ errorMessage() }}
    </span>
  }
</div>
