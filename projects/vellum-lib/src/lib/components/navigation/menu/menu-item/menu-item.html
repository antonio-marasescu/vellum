<li [attr.id]="id()" [class.relative]="submenuFloating()">
  <button
    type="button"
    [class]="rowClasses()"
    [disabled]="isDisabled()"
    [attr.aria-expanded]="hasSubmenu() ? expanded() : null"
    [attr.aria-current]="active() ? 'page' : null"
    (click)="onRowClick()"
  >
    <span class="vlm-menu-item__label min-w-0 flex-1 text-left break-words">
      <ng-content></ng-content>
    </span>
    @if (hasSubmenu()) {
      <svg
        [class]="chevronClasses()"
        [class.rotate-90]="expanded()"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 4L10 8L6 12" />
      </svg>
    }
  </button>
  @if (hasSubmenu()) {
    <div
      [class]="submenuWrapperClasses()"
      [class.hidden]="submenuFloating() && !expanded()"
      [style.grid-template-rows]="submenuFloating() ? null : expanded() ? '1fr' : '0fr'"
    >
      <div [class.overflow-hidden]="!submenuFloating()">
        <ng-content select="[menuItems]"></ng-content>
      </div>
    </div>
  }
</li>
