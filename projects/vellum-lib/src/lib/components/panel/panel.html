<div [attr.id]="id()" [class]="panelClasses()">
  <div
    [class]="headerClasses()"
    [attr.role]="disabled() ? null : 'button'"
    [attr.tabindex]="disabled() ? null : 0"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="contentId()"
    (click)="onToggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="vlm-panel__header-content min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">
      <ng-content select="[panelHeader]"></ng-content>
    </span>
    <svg
      class="vlm-panel__chevron h-[var(--chevron-size)] w-[var(--chevron-size)] transition-transform duration-[var(--vlm-panel-transition-duration)] ease-[ease]"
      [class.rotate-180]="expanded()"
      viewBox="0 0 16 16"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M4 6L8 10L12 6" />
    </svg>
  </div>
  <div
    class="vlm-panel__body-wrapper grid transition-[grid-template-rows] duration-[var(--vlm-panel-transition-duration)] ease-[ease]"
    [style.grid-template-rows]="expanded() ? '1fr' : '0fr'"
  >
    <div class="overflow-hidden">
      <div [attr.id]="contentId()" [class]="bodyClasses()">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
