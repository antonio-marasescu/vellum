<button
  type="button"
  [class]="buttonClasses()"
  [attr.id]="id()"
  [disabled]="disabled()"
  [attr.aria-label]="isFab() ? label() : null"
  [class.vlm-button--icon]="useIcon()"
  (click)="onClick()"
>
  <ng-content select="[preIcon]"></ng-content>
  @if (label() && !isFab()) {
    <span class="vlm-button__label whitespace-nowrap">{{ label() }}</span>
  }
  <ng-content select="[postIcon]"></ng-content>
</button>
