<button
  type="button"
  [class]="buttonClasses()"
  [attr.id]="id()"
  [disabled]="disabled()"
  (click)="onClick()"
>
  <span [class]="offIconClasses()">
    <ng-content select="[swapOff]"></ng-content>
  </span>
  <span [class]="onIconClasses()">
    <ng-content select="[swapOn]"></ng-content>
  </span>
</button>
